name: Feature request
description: Propose a new capability or a change in behaviour.
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why the current behaviour falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Desired behaviour
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: How would you know it's solved?
      description: Optional. Concrete, checkable outcomes — they become acceptance criteria.
