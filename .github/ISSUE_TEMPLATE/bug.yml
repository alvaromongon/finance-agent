name: Bug report
description: Something doesn't work as expected.
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: The observed behaviour, including any error message.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version / environment
      placeholder: e.g. v1.4.2, Docker on Linux
