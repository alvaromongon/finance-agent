name: Finance Agent — Commit changes
description: >
  Applies the patch left by one of the engine's reusable workflows and commits
  only the given paths to the calling repository. Needs a previous checkout
  with write permission.

inputs:
  artifact:
    description: "Artifact with changes.patch (the reusable workflow's changes-artifact output)"
    required: true
  paths:
    description: "Paths to commit, separated by spaces"
    required: true
  message:
    description: "Commit message; the UTC date (YYYY-MM-DD) is appended"
    required: true
  state-paths:
    description: >
      Paths of the engine's state (its store and the view generated from it), separated by spaces. If another run
      committed any of them since this checkout, this run's changes to them are dropped with a warning (the price
      refresh is rewritten by the next run) and the rest is committed. Empty: the paths are committed as any other.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/finance-agent-changes

    - name: Apply and commit
      shell: bash
      env:
        PATCH_FILE: ${{ runner.temp }}/finance-agent-changes/changes.patch
        COMMIT_PATHS: ${{ inputs.paths }}
        COMMIT_MESSAGE: ${{ inputs.message }}
        STATE_PATHS: ${{ inputs.state-paths }}
      run: ${{ github.action_path }}/commit.sh
