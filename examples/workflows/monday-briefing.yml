# Example caller: Monday briefing, API mode (evaluates the decision log, then writes the report).
# Copy to .github/workflows/ in your data repository. See the README, "Reasoner: API or handoff" > "API runner: GitHub Actions".
name: Finance Agent — Monday briefing

on:
  schedule:
    - cron: "0 6 * * 1" # Monday morning, UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: finance-agent-monday-briefing
  cancel-in-progress: false

jobs:
  monday-briefing:
    permissions:
      contents: read
    uses: alvaromongon/finance-agent/.github/workflows/monday-briefing.yml@v0.2.0
    with:
      data-path: finance-agent # where your brain lives in this repo; change it together with the finance-agent/ paths in this file
      engine-repository: alvaromongon/finance-agent
      engine-ref: v0.2.0
      output-language: en
      reference-ticker-eur: ${{ vars.REFERENCE_TICKER_EUR }}
      reference-ticker-usd: ${{ vars.REFERENCE_TICKER_USD }}
      smtp-user: ${{ vars.SMTP_USER }}
      alert-email-to: ${{ vars.ALERT_EMAIL_TO }}
      # To run without email, delete the two lines above and the SMTP_PASS secret
      # below, and uncomment this line:
      # email: false
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}

  commit:
    needs: monday-briefing
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: alvaromongon/finance-agent/.github/actions/commit-changes@v0.2.0
        with:
          artifact: ${{ needs.monday-briefing.outputs.changes-artifact }}
          # What it writes: logs/ (decisions-evaluation.md, <date>-monday-briefing.md),
          # the last prices (telemetry/, and the view portfolio.md), and the tickers it proposes to retire from the watchlist
          # (a stop_watching batch in inbox/, which the inbox workflow applies) with their archived tesis/ notes.
          # Change the finance-agent/ prefix together with data-path.
          # Prices are telemetry, never state (telemetry/ and the view portfolio.md generated with them): the store,
          # state/portfolio.json, is written by inbox.yml alone. If another run committed state since this one
          # started, the view (state-paths) is dropped and the rest is committed.
          paths: finance-agent/logs/ finance-agent/inbox/ finance-agent/portfolio.md finance-agent/telemetry/ finance-agent/state/config/ finance-agent/tesis/
          state-paths: finance-agent/state/ finance-agent/portfolio.md
          message: "chore(logs): Monday briefing"
